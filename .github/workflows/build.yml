name: Build
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - name: whisper.cpp laden (Spracherkennung, unverändert vom Upstream)
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/ggml-org/whisper.cpp/releases/download/b5454/whisper-bin-x64.zip -OutFile whisper.zip
          Expand-Archive whisper.zip -DestinationPath whisper
          $server = Get-ChildItem whisper -Recurse -Filter whisper-server.exe | Select-Object -First 1
          New-Item -ItemType Directory -Force build/helper-bin-win | Out-Null
          Copy-Item $server.FullName build/helper-bin-win/
          Copy-Item (Join-Path $server.DirectoryName '*.dll') build/helper-bin-win/
          Get-ChildItem build/helper-bin-win
      - run: node scripts/helper/build.mjs
        env:
          CHETTI_KNOWLEDGE_URL: ${{ secrets.CHETTI_KNOWLEDGE_URL }}
      - name: Probelauf (installieren, starten, abfragen, entfernen)
        shell: pwsh
        env:
          CHETTI_HELPER_TEST: '1'
        run: |
          $installer = Get-ChildItem build/helper-app/release/*.exe | Select-Object -First 1
          Start-Process $installer.FullName -ArgumentList '/S' -Wait
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter 'Chetti Helfer.exe' | Select-Object -First 1
          if (-not $exe) { throw 'Programm nicht installiert.' }
          Start-Process $exe.FullName
          $info = $null
          foreach ($i in 1..30) {
            Start-Sleep -Seconds 2
            $info = curl.exe -sk https://127.0.0.1:47813/helper/info
            if ($info) { break }
          }
          if (-not $info) { Get-Content "$env:APPDATA\Chetti Helfer\helfer.log" -ErrorAction SilentlyContinue; throw 'Der Helfer antwortet nicht.' }
          $info
          if (-not (Test-Path "$env:APPDATA\Chetti Helfer\wissen\stil")) { throw 'Wissensbasis fehlt.' }
          Stop-Process -Name 'Chetti Helfer' -Force
          $uninstaller = Get-ChildItem $exe.DirectoryName -Filter 'Uninstall*.exe' | Select-Object -First 1
          Start-Process $uninstaller.FullName -ArgumentList '/S' -Wait
          Start-Sleep -Seconds 5
          if (Test-Path $exe.FullName) { throw 'Programm nach der Deinstallation noch vorhanden.' }
      - id: upload
        uses: actions/upload-artifact@v4
        with:
          name: Chetti-Helfer-win
          path: build/helper-app/release/*.exe
          if-no-files-found: error
      # Signatur über SignPath: läuft, sobald die Organisation eingetragen ist (Variable SIGNPATH_ORGANIZATION_ID, Secret SIGNPATH_API_TOKEN).
      - name: Signieren (SignPath)
        if: vars.SIGNPATH_ORGANIZATION_ID != '' && startsWith(github.ref, 'refs/tags/')
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'chetti-helfer' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.upload.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' && 'signed/*.exe' || 'build/helper-app/release/*.exe' }}
